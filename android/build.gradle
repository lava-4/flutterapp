allprojects {
    repositories {
        google() // Required for Firebase
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// Add this plugin to enable Firebase services
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.0' // Firebase plugin for Google services
        classpath 'com.android.tools.build:gradle:8.1.0' // Ensure this is up to date
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
